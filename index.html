// ─── AUDIO ENGINE ──────────────────────────────────────────────────────────────
// Synth fallbacks for sounds without an MP3 yet
function buildNoise(ctx, type) {
  const sr=ctx.sampleRate, n=sr*7, buf=ctx.createBuffer(1,n,sr), d=buf.getChannelData(0);
  if(type==="white"){for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
  else if(type==="pink"){let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)/7;b6=w*0.115926;}}
  else if(type==="womb"){let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=0.99886*b0+w*0.0555;b1=0.99332*b1+w*0.075;b2=0.969*b2+w*0.1538;b3=0.8665*b3+w*0.3104;b4=0.55*b4+w*0.5329;b5=-0.7616*b5-w*0.0168;d[i]=(b0+b1+b2+b3+b4+b5)/6*(0.6+0.4*Math.sin(2*Math.PI*i/(sr*10)));}}
  return buf;
}
function buildHeartbeat(ctx) {
  const sr=ctx.sampleRate, bl=Math.round(sr*60/65), beats=4, buf=ctx.createBuffer(1,bl*beats,sr), d=buf.getChannelData(0);
  const hit=(s,f,dur,a)=>{for(let i=0;i<dur*sr&&s+i<d.length;i++)d[s+i]+=Math.sin(2*Math.PI*f*i/sr)*Math.exp(-i/(sr*0.07))*a;};
  for(let b=0;b<beats;b++){hit(b*bl,55,0.15,0.9);hit(b*bl+Math.round(sr*0.22),45,0.12,0.7);}
  return buf;
}

class AudioEngine {
  constructor() { this.ctx=null; this.nodes={}; this.buffers={}; this.loading={}; }

  init() {
    if(!this.ctx) this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(this.ctx.state==="suspended") this.ctx.resume();
  }

  // Preload an MP3 into an AudioBuffer
  async preload(id) {
    if(this.buffers[id] || this.loading[id]) return;
    this.loading[id] = true;
    try {
      const res  = await fetch(`sounds/${id}.mp3`);
      const arr  = await res.arrayBuffer();
      this.init();
      this.buffers[id] = await this.ctx.decodeAudioData(arr);
    } catch(e) {
      console.warn(`[Lunita] Could not load sounds/${id}.mp3 — using synth fallback`, e);
      this.buffers[id] = null; // null = use synth
    }
    delete this.loading[id];
  }

  async play(id, vol=0.7, useMp3=false) {
    this.init();
    if(this.nodes[id]) return;
    if(useMp3) await this.preload(id);

    const ctx  = this.ctx;
    const gain = ctx.createGain(); gain.gain.value=vol; gain.connect(ctx.destination);
    const src  = ctx.createBufferSource();

    const mp3buf = this.buffers[id]; // null if preload failed
    if(useMp3 && mp3buf) {
      src.buffer = mp3buf;
    } else {
      // Synth fallback
      src.buffer = id==="heart" ? buildHeartbeat(ctx) : buildNoise(ctx, id);
    }
    src.loop = true;
    src.connect(gain);
    src.start();
    this.nodes[id] = { src, gain };
  }

  stop(id) {
    if(!this.nodes[id]) return;
    const{src,gain}=this.nodes[id];
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime+0.5);
    setTimeout(()=>{ try{src.stop();}catch{} gain.disconnect(); }, 600);
    delete this.nodes[id];
  }

  setVol(id,v) { if(this.nodes[id]) this.nodes[id].gain.gain.value=v; }

  destroy() { Object.keys(this.nodes).forEach(id=>this.stop(id)); if(this.ctx){this.ctx.close();this.ctx=null;} }
}

// Local date string (YYYY-MM-DD) using device timezone — not UTC
const localDateStr = (d) => {
  const dt = d ? new Date(d) : new Date();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
};

};
const nowTimeStr = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const hexA       = (hex,a) => { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
const calcDur    = (sd,st,ed,et) => { if(!sd||!st||!ed||!et)return null; const d=(new Date(`${ed}T${et}`)-new Date(`${sd}T${st}`))/1000; return d>0?Math.round(d):null; };
const fmtDur     = s => { if(!s||s<=0)return "—"; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; if(h>0)return `${h}h ${m}min`; return m>0?`${m}min${sec>0?` ${sec}s`:""}`:`${sec}s`; };
const fmtDateTime= (date,time) => {
  if(!time)return "—"; if(!date)return time;
  const d=new Date(`${date}T${time}`),today=new Date(),yest=new Date(today); yest.setDate(yest.getDate()-1);
  if(d.toDateString()===today.toDateString())return time;
  if(d.toDateString()===yest.toDateString())return `Ayer ${time}`;
  return `${d.getDate()} ${d.toLocaleDateString("es-ES",{month:"short"})} ${time}`;
};

// ─── SETUP SCREEN ──────────────────────────────────────────────────────────────
function SetupScreen({ onDone }) {
  const [step,setStep]       = useState(0);
  const [name,setName]       = useState("");
  const [code,setCode]       = useState("");
  const [loading,setLoading] = useState(false);
  const [error,setError]     = useState("");

  const handleCreate = async () => {
    if(!name.trim()) return;
    setLoading(true); setError("");
    const newCode = genCode(name.trim());
    try {
      await createSala(newCode, name.trim());
      const setup = { mode:"sala", roomCode:newCode, babyName:name.trim() };
      saveSetup(setup); onDone(setup);
    } catch(e) { setError("Error al crear la sala. Comprueba tu conexión."); setLoading(false); }
  };

  const handleJoin = async () => {
    const c = code.trim().toUpperCase();
    if(!c) return;
    setLoading(true); setError("");
    try {
      const data = await getSala(c);
      if(!data) { setError("Sala no encontrada. Comprueba el código."); setLoading(false); return; }
      const setup = { mode:"sala", roomCode:c, babyName:data.babyName };
      saveSetup(setup); onDone(setup);
    } catch(e) { setError("Error al conectar. Comprueba tu conexión."); setLoading(false); }
  };

  const inp  = { ...tInput, width:"100%", fontSize:17, marginBottom:14 };
  const T    = t => <div style={{fontSize:21,fontWeight:900,marginBottom:8,color:C.text,lineHeight:1.3}}>{t}</div>;
  const Sub  = t => <div style={{fontSize:13,color:C.muted,marginBottom:24,lineHeight:1.6}}>{t}</div>;

  return (
    <div style={{minHeight:"100vh",backgroundColor:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'Nunito',system-ui,sans-serif",color:C.text}}>
      <div style={{fontSize:64,marginBottom:16}}>🌙</div>
      <div style={{fontSize:28,fontWeight:900,marginBottom:4}}>Lunita</div>
      <div style={{fontSize:13,color:C.muted,marginBottom:44}}>Herramientas para padres primerizos</div>

      {step===0&&<div style={{width:"100%",maxWidth:380}}>
        {T("¿Cómo quieres usar la app?")}
        {Sub("Úsala solo en este dispositivo, o comparte los registros con tu pareja en tiempo real.")}
        <button style={bigBtn} onClick={()=>{saveSetup({mode:"local"});onDone({mode:"local"});}}>
          <span style={{fontSize:24}}>📱</span>
          <div><div style={{fontWeight:800,fontSize:16}}>Solo en este móvil</div><div style={{fontSize:12,color:C.muted,fontWeight:400}}>Los registros se guardan aquí</div></div>
        </button>
        <button style={bigBtn} onClick={()=>setStep(1)}>
          <span style={{fontSize:24}}>👨‍👩‍👧</span>
          <div><div style={{fontWeight:800,fontSize:16}}>Sala compartida</div><div style={{fontSize:12,color:C.muted,fontWeight:400}}>Sincronización en tiempo real entre dos móviles</div></div>
        </button>
      </div>}

      {step===1&&<div style={{width:"100%",maxWidth:380}}>
        {T("Sala compartida")}
        {Sub("¿Eres el primero en configurar la app o ya existe una sala?")}
        <button style={bigBtn} onClick={()=>setStep(2)}>
          <span style={{fontSize:24}}>✨</span>
          <div><div style={{fontWeight:800,fontSize:16}}>Crear sala nueva</div><div style={{fontSize:12,color:C.muted,fontWeight:400}}>Genera un código para compartir</div></div>
        </button>
        <button style={bigBtn} onClick={()=>setStep(3)}>
          <span style={{fontSize:24}}>🔑</span>
          <div><div style={{fontWeight:800,fontSize:16}}>Unirme con un código</div><div style={{fontSize:12,color:C.muted,fontWeight:400}}>El otro padre/madre ya creó la sala</div></div>
        </button>
        <button style={ghostBtn} onClick={()=>setStep(0)}>← Atrás</button>
      </div>}

      {step===2&&<div style={{width:"100%",maxWidth:380}}>
        {T("Crear sala")}
        {Sub("Escribe el nombre del bebé. Se usará para generar el código de sala.")}
        <label style={UL}>Nombre del bebé</label>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Ej: Ignaciu" style={inp} onKeyDown={e=>e.key==="Enter"&&handleCreate()}/>
        {error&&<div style={{fontSize:13,color:C.orange,marginBottom:14}}>{error}</div>}
        <button style={primaryBtn} onClick={handleCreate} disabled={!name.trim()||loading}>
          {loading?<span className="spin">⏳</span>:"✨ Crear sala"}
        </button>
        <button style={ghostBtn} onClick={()=>{setStep(1);setError("");}}>← Atrás</button>
      </div>}

      {step===3&&<div style={{width:"100%",maxWidth:380}}>
        {T("Unirme a una sala")}
        {Sub("Introduce el código que te ha compartido el otro padre/madre.")}
        <label style={UL}>Código de sala</label>
        <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="Ej: IGNA-4821" style={{...inp,letterSpacing:3}} onKeyDown={e=>e.key==="Enter"&&handleJoin()}/>

        </button>
        <button style={ghostBtn} onClick={()=>{setStep(1);setError("");}}>← Atrás</button>
      </div>}
    </div>
  );
}

// ─── EXPORT / IMPORT ───────────────────────────────────────────────────────────
function exportJSON(entries, babyName) {
  const data = { app:"Lunita", exportedAt:new Date().toISOString(), babyName:babyName||"registros", entries };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `lunita_${(babyName||"registros").toLowerCase().replace(/\s+/g,"_")}_${todayStr()}.json`;
  a.click();
}
function ImportModal({ onImport, onClose }) {
  const [error,setError] = useState("");
  const fileRef = useRef();
  const handleFile = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const entries = data.entries||(Array.isArray(data)?data:null);
        if(!entries){setError("Archivo no válido.");return;}
        onImport(entries); onClose();
      } catch { setError("No se pudo leer el archivo."); }
    };
    reader.readAsText(file);
  };
  return (
    <div style={OVERLAY} onClick={onClose}><div className="sheet" style={SHEET} onClick={e=>e.stopPropagation()}>
      <div style={{fontSize:19,fontWeight:900,marginBottom:16,color:C.text}}>📤 Importar registros</div>
      <div style={{backgroundColor:hexA(C.orange,0.1),borderRadius:12,padding:"12px 14px",marginBottom:20,border:`1px solid ${hexA(C.orange,0.4)}`}}>
        <div style={{fontSize:13,color:C.orange,lineHeight:1.6}}>⚠️ Los registros importados se <strong>añadirán</strong> a los actuales (sin borrar nada).</div>
      </div>
      <input ref={fileRef} type="file" accept=".json" onChange={handleFile} style={{display:"none"}}/>
      <button style={primaryBtn} onClick={()=>fileRef.current?.click()}>📁 Elegir archivo .json</button>
      {error&&<div style={{fontSize:13,color:C.orange,margin:"8px 0"}}>{error}</div>}
      <button style={ghostBtn} onClick={onClose}>Cancelar</button>
    </div></div>
  );
}

  if(s.type==="panal"&&s.step===12) return (<div style={OVERLAY}><div className="sheet" style={SHEET}>
    {T("✅ Guardar pañal")}
    <div style={{backgroundColor:C.elevated,borderRadius:14,padding:"4px 16px 8px",marginBottom:16,border:`1px solid ${C.border}`}}>
      <SRow label="Tipo" value={({pis:"💧 Pipí",caca:"💩 Caca",mixto:"🌊 Mixto"})[s.diaper]}/>
      {s.amount&&<SRow label="Cantidad" value={s.amount} hi/>}
    </div>
    <button style={nowBtn} onClick={()=>setS(p=>({...p,sd:todayStr(),st:nowTimeStr()}))}><span style={{fontSize:20}}>🕐</span><div><div style={{fontWeight:800}}>¿Es ahora?</div><div style={{fontSize:12,fontWeight:400}}>{new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}</div></div></button>
    <div style={{margin:"12px 0 16px"}}><DTPicker label="O elige fecha y hora" date={s.sd} time={s.st} onDate={v=>u("sd",v)} onTime={v=>u("st",v)}/></div>
    <CommentBox value={s.comment} onChange={v=>u("comment",v)}/>
    {s.st&&<button style={primaryBtn} onClick={saveComplete}>💾 Guardar pañal</button>}
    <button style={ghostBtn} onClick={()=>u("step",s.diaper==="pis"?10:11)}>← Atrás</button>
  </div></div>);

  return null;
}

const getEntryDate = e => e.startDate ? e.startDate : localDateStr(e.createdAt);

const fmtDayLabel = dateStr => {
  const t = todayStr();
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const y = localDateStr(yest);
  if(dateStr===t) return "Hoy";
  if(dateStr===y) return "Ayer";
  const d = new Date(dateStr+"T12:00:00");
  return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
};

function RegistroView({ entries, onDelete, onFinalize, onEdit, onExport, onImport, onReorder }) {
  const enCurso = entries.filter(e=>e.status==="en_curso").length;
  const days    = [...new Set(entries.map(getEntryDate))].sort((a,b)=>b.localeCompare(a));
  const topDay  = days[0] || todayStr();
  const topEntries = entries.filter(e=>getEntryDate(e)===topDay);

  // ── Drag state ──
  const [dragId,  setDragId]  = useState(null);  // id of entry being dragged
  const [dropIdx, setDropIdx] = useState(null);  // insert position in flat entries array
  const [ghostY,  setGhostY]  = useState(0);
  const [ghostH,  setGhostH]  = useState(60);
  const [ghostLabel, setGhostLabel] = useState("");
  const itemRefs    = useRef({});
  const longPressRef = useRef(null);
  const offsetYRef  = useRef(0);

  const startLongPress = (e, entry) => {
    if(entry.type !== "panal" && entry.breast !== "jeringa-dedo" && entry.breast !== "extraccion") return;
    const touch = e.touches[0];
    longPressRef.current = setTimeout(() => {
      navigator.vibrate?.(30);
      const el = itemRefs.current[entry.id];
      if(!el) return;
      const rect = el.getBoundingClientRect();
      offsetYRef.current = touch.clientY - rect.top;
      setGhostY(rect.top);
      setGhostH(rect.height);
      setGhostLabel(entry.breast==="jeringa-dedo" ? `🍼 Biberón · ${entry.ml||"?"}ml` : entry.breast==="extraccion" ? `🥛 Sacaleches ${entry.extBreast==="left"?"izq.":"dch."} · ${entry.ml||"?"}ml` : `${({pis:"💧 Pipí",caca:"💩 Caca",mixto:"🌊 Mixto"})[entry.diaperType]}${entry.amount?" · "+entry.amount:""}`);
      setDragId(entry.id);
      setDropIdx(entries.findIndex(en=>en.id===entry.id));
    }, 380);
  };

  const cancelLong = () => clearTimeout(longPressRef.current);

  // Global touch handlers while dragging
  useEffect(() => {
    if(!dragId) return;
    const onMove = e => {
      e.preventDefault();
      const touch = e.touches[0];
      setGhostY(touch.clientY - offsetYRef.current);
      // Find which slot the finger is over
      let newDrop = entries.length;
      for(let i=0; i<entries.length; i++) {
        const el = itemRefs.current[entries[i].id];
        if(!el) continue;
        const rect = el.getBoundingClientRect();
        if(touch.clientY < rect.top + rect.height/2) { newDrop = i; break; }
      }
      setDropIdx(newDrop);
    };
    const onEnd = () => {
      const fromIdx = entries.findIndex(e=>e.id===dragId);
      if(fromIdx !== -1 && dropIdx !== null) {
        let insertAt = dropIdx > fromIdx ? dropIdx - 1 : dropIdx;
        if(insertAt !== fromIdx) {
          const ne = [...entries];
          const [item] = ne.splice(fromIdx, 1);
          ne.splice(insertAt, 0, item);
          onReorder(ne);
        }
      }
      setDragId(null); setDropIdx(null);
    };
    document.addEventListener("touchmove", onMove, {passive:false});
    document.addEventListener("touchend",  onEnd);
    document.addEventListener("touchcancel", onEnd);
    return () => {
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend",  onEnd);
      document.removeEventListener("touchcancel", onEnd);
    };
  }, [dragId, dropIdx, entries]);

  return (
    <div>
      {/* Ghost element */}
      {dragId && (
        <div style={{
          position:"fixed", left:14, right:14, top:ghostY, zIndex:500,
          height:ghostH, backgroundColor:C.elevated, borderRadius:14,
          border:`2px solid ${C.orange}`, display:"flex", alignItems:"center",
          padding:"0 16px", gap:10, pointerEvents:"none",
          boxShadow:`0 8px 32px rgba(0,0,0,0.5)`,
        }}>
          <span style={{fontSize:20}}>{ghostLabel.startsWith("🍼")?"🍼":ghostLabel.startsWith("🥛")?"🥛":"🧷"}</span>
          <span style={{fontSize:14,fontWeight:800,color:C.text}}>{ghostLabel.replace(/^[🍼🧷]\s*/,"")}</span>
        </div>
      )}

      <div style={{padding:"16px 16px 10px"}}>
        <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"capitalize",marginBottom:8,letterSpacing:0.5}}>{fmtDayLabel(topDay)}</div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          {[
            {label:"Tomas",  value:topEntries.filter(e=>e.type==="toma"&&e.breast!=="jeringa-dedo"&&e.breast!=="extraccion").length, emoji:"🤱"},
            {label:"Biberón",value:topEntries.filter(e=>e.breast==="jeringa-dedo").length, emoji:"🍼"},
            {label:"Pañales",value:topEntries.filter(e=>e.type==="panal").length, emoji:"🧷"},
          ].map(s=>(
            <div key={s.label} style={{flex:1,backgroundColor:C.surface,borderRadius:14,padding:"10px 10px",border:`1px solid ${C.border}`,textAlign:"center"}}>
              <div style={{fontSize:20}}>{s.emoji}</div>
              <div style={{fontSize:22,fontWeight:900,color:C.accent,lineHeight:1.1}}>{s.value}</div>
              <div style={{fontSize:10,color:C.muted,marginTop:2}}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8,marginBottom:enCurso>0?10:0}}>
          <button onClick={onExport} style={{flex:1,padding:"9px 10px",borderRadius:10,border:`1px solid ${C.border}`,backgroundColor:C.surface,color:C.muted,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>📥 Exportar</button>
          <button onClick={onImport} style={{flex:1,padding:"9px 10px",borderRadius:10,border:`1px solid ${C.border}`,backgroundColor:C.surface,color:C.muted,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>📤 Importar</button>
        </div>
        {enCurso>0&&<div style={{backgroundColor:hexA(C.orange,0.1),borderRadius:12,padding:"10px 14px",border:`1px solid ${hexA(C.orange,0.4)}`,display:"flex",alignItems:"center",gap:8}}>
          <span>⏱</span><span style={{fontSize:13,fontWeight:700,color:C.orange}}>{enCurso} toma{enCurso>1?"s":""} en curso — pulsa para añadir el fin</span>
        </div>}
        {entries.some(e=>e.type==="panal") && !dragId && (
          <div style={{fontSize:11,color:C.muted,marginTop:10,textAlign:"center"}}>
            Mantén pulsado <strong style={{color:C.text}}>⠿</strong> en un pañal, biberón o extracción para reordenarlo
          </div>
        )}
      </div>

      {entries.length===0?(
        <div style={{textAlign:"center",padding:"50px 24px",color:C.muted}}>
          <div style={{fontSize:52,marginBottom:14}}>🌙</div>
          <div style={{fontSize:17,fontWeight:800,color:C.text}}>Sin registros todavía</div>
          <div style={{fontSize:13,marginTop:8,lineHeight:1.6}}>Pulsa <strong style={{color:C.accent}}>+</strong> para añadir la primera toma o cambio de pañal</div>
        </div>
      ):(
        <div style={{paddingBottom:4}}>
          {/* Flat list with day separators and drop indicators */}
          {(() => {
            const items = [];
            let lastDay = null;
            entries.forEach((e, flatIdx) => {
              const eDay = getEntryDate(e);
              // Drop indicator before this item
              if(dragId && dropIdx === flatIdx) items.push(<DropLine key={`drop-${flatIdx}`}/>);
              // Day separator
              if(eDay !== lastDay && lastDay !== null) {
                const dEntries = entries.filter(en=>getEntryDate(en)===eDay);
                items.push(<DaySeparator key={`sep-${eDay}`} label={fmtDayLabel(eDay)} tomas={dEntries.filter(en=>en.type==="toma"&&en.breast!=="jeringa-dedo"&&en.breast!=="extraccion").length} biberones={dEntries.filter(en=>en.breast==="jeringa-dedo").length} panales={dEntries.filter(en=>en.type==="panal").length}/>);
              }
              lastDay = eDay;
              items.push(
                <div key={e.id} ref={el=>{ if(el) itemRefs.current[e.id]=el; else delete itemRefs.current[e.id]; }}>
                  <EntryCard
                    entry={e}
                    onDelete={onDelete}
                    onFinalize={onFinalize}
                    onEdit={onEdit}
                    isDragging={dragId===e.id}
                    dragHandleProps={(e.type==="panal"||(e.type==="toma"&&(e.breast==="jeringa-dedo"||e.breast==="extraccion"))) ? {
                      onTouchStart: ev => startLongPress(ev, e),
                      onTouchMove:  cancelLong,
                      onTouchEnd:   cancelLong,
                    } : {}}
                  />
                </div>
              );
            });
            // Drop indicator at end
            if(dragId && dropIdx === entries.length) items.push(<DropLine key="drop-end"/>);
            return items;
          })()}
        </div>
      )}
    </div>
  );
}

// ─── STATS MODAL ───────────────────────────────────────────────────────────────
function StatsModal({ entries, onClose }) {
  const [days, setDays] = useState(7);

  // Build last N days array
  const dateRange = Array.from({length:days}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate() - (days-1-i));
    return d.toISOString().slice(0,10);
  });

  const dataByDay = dateRange.map(date => {
    const de = entries.filter(e => {
      const ed = e.startDate || localDateStr(e.createdAt);
      return ed === date;
    });
    const suenoSecs = de.filter(e=>e.type==="sueno"&&e.status==="done"&&e.duration).reduce((a,e)=>a+e.duration,0);
    return {
      date,
      tomas:    de.filter(e=>e.type==="toma"&&e.breast!=="jeringa-dedo"&&e.breast!=="extraccion").length,
      biberones:de.filter(e=>e.breast==="jeringa-dedo").length,
      panales:  de.filter(e=>e.type==="panal").length,
      suenoH:   Math.round(suenoSecs/3600*10)/10,
    };
  });

  const maxVal = Math.max(1, ...dataByDay.map(d=>Math.max(d.tomas,d.biberones,d.panales,d.suenoH)));

  // SVG chart dimensions
  const W=340, H=180, padL=28, padB=30, padT=10, padR=10;
  const chartW=W-padL-padR, chartH=H-padB-padT;
  const barGroup=chartW/days, barW=Math.max(4,Math.floor(barGroup/5)), gap=1;

  const BAR_COLORS = { tomas:"#f5a623", biberones:"#62a8f5", panales:"#4ade80" };

  const fmtAxisDate = dateStr => {
    const d = new Date(dateStr+"T12:00:00");
    return `${d.getDate()}/${d.getMonth()+1}`;
  };

  // Totals for the period
  const totals = dataByDay.reduce((acc,d)=>({
    tomas:acc.tomas+d.tomas, biberones:acc.biberones+d.biberones, panales:acc.panales+d.panales
  }), {tomas:0,biberones:0,panales:0});

  const yLines = [0.25,0.5,0.75,1.0];

  return (
    <div style={{position:"fixed",inset:0,backgroundColor:"rgba(0,0,0,0.9)",zIndex:400,display:"flex",flexDirection:"column",fontFamily:"'Nunito',system-ui,sans-serif",color:C.text,overflowY:"auto"}}>

      {/* Header */}
      <div style={{padding:"calc(env(safe-area-inset-top,0px)+14px) 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <div>
          <div style={{fontSize:18,fontWeight:900}}>📊 Estadísticas</div>
          <div style={{fontSize:11,color:C.muted}}>Resumen de registros</div>
        </div>
        <button onClick={onClose} style={{border:`1px solid ${C.border}`,backgroundColor:C.surface,borderRadius:10,padding:"6px 14px",color:C.muted,fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>Cerrar</button>
      </div>

      <div style={{padding:16,flex:1}}>

        {/* Range selector */}
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          {[7,14,30].map(d=>(
            <button key={d} onClick={()=>setDays(d)} style={{
              flex:1,padding:"8px",borderRadius:10,border:`1px solid ${days===d?C.accent:C.border}`,
              backgroundColor:days===d?C.accentDim:C.surface,color:days===d?C.accent:C.muted,
              fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"
            }}>{d===7?"7 días":d===14?"14 días":"30 días"}</button>
          ))}
        </div>

        {/* SVG Chart */}
        <div style={{backgroundColor:C.surface,borderRadius:16,padding:"16px 8px 8px",marginBottom:16,border:`1px solid ${C.border}`,overflowX:"auto"}}>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block",minWidth:Math.max(300,days*22)}}>
            {/* Y grid lines */}
            {yLines.map(f=>{
              const y = padT + chartH*(1-f);
              const val = Math.round(maxVal*f);
              return (
                <g key={f}>
                  <line x1={padL} y1={y} x2={W-padR} y2={y} stroke={C.border} strokeWidth="1"/>
                  <text x={padL-4} y={y+4} textAnchor="end" fontSize="9" fill={C.muted}>{val}</text>
                </g>
              );
            })}

            {/* Bars */}
            {dataByDay.map((d,i)=>{
              const cx = padL + i*barGroup + barGroup/2;
              const bars = [
                {key:"tomas",    val:d.tomas,     color:BAR_COLORS.tomas},
                {key:"biberones",val:d.biberones,  color:BAR_COLORS.biberones},
                {key:"panales",  val:d.panales,    color:BAR_COLORS.panales},
                {key:"sueno",    val:d.suenoH,     color:"#818cf8"},
              ];
              const totalBarsW = bars.length*(barW+gap)-gap;
              return (
                <g key={d.date}>
                  {bars.map((b,bi)=>{
                    const bh = b.val===0 ? 0 : Math.max(4, (b.val/maxVal)*chartH);
                    const bx = cx - totalBarsW/2 + bi*(barW+gap);
                    const by = padT + chartH - bh;
                    return (
                      <g key={b.key}>
                        <rect x={bx} y={by} width={barW} height={bh} rx="2" fill={b.color} opacity="0.85"/>
                        {b.val>0&&bh>12&&<text x={bx+barW/2} y={by-2} textAnchor="middle" fontSize="8" fill={b.color} fontWeight="bold">{b.val}</text>}
                      </g>
                    );
                  })}
                  {/* X label */}
                  <text x={cx} y={H-4} textAnchor="middle" fontSize="8" fill={C.muted}>{fmtAxisDate(d.date)}</text>
                </g>
              );
            })}
          </svg>
        </div>

        {/* Legend */}
        <div style={{display:"flex",justifyContent:"center",gap:12,marginBottom:20,flexWrap:"wrap"}}>
          {[{label:"Tomas",color:BAR_COLORS.tomas,emoji:"🤱"},{label:"Biberón",color:BAR_COLORS.biberones,emoji:"🍼"},{label:"Pañales",color:BAR_COLORS.panales,emoji:"🧷"},{label:"Sueño(h)",color:"#818cf8",emoji:"😴"}].map(l=>(
            <div key={l.label} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:10,height:10,borderRadius:2,backgroundColor:l.color}}/>
              <span style={{fontSize:11,color:C.muted}}>{l.label}</span>
            </div>
          ))}
        </div>

        {/* Totals */}
        <div style={{fontSize:12,fontWeight:800,color:C.muted,letterSpacing:0.5,textTransform:"uppercase",marginBottom:10}}>
          Total últimos {days} días
        </div>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          {[
            {label:"Tomas",    value:totals.tomas,     emoji:"🤱", color:BAR_COLORS.tomas},
            {label:"Biberones",value:totals.biberones,  emoji:"🍼", color:BAR_COLORS.biberones},
            {label:"Pañales",  value:totals.panales,    emoji:"🧷", color:BAR_COLORS.panales},
          ].map(s=>(
            <div key={s.label} style={{flex:1,backgroundColor:C.surface,borderRadius:14,padding:"12px 10px",border:`1px solid ${C.border}`,textAlign:"center"}}>
              <div style={{fontSize:20}}>{s.emoji}</div>
              <div style={{fontSize:22,fontWeight:900,color:s.color,lineHeight:1.1}}>{s.value}</div>
              <div style={{fontSize:10,color:C.muted,marginTop:2}}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* Daily averages */}
        <div style={{backgroundColor:C.surface,borderRadius:14,padding:"12px 16px",border:`1px solid ${C.border}`}}>
          <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Media diaria</div>
          {[
            {label:"Tomas",    value:(totals.tomas/days).toFixed(1),    emoji:"🤱"},
            {label:"Biberones",value:(totals.biberones/days).toFixed(1), emoji:"🍼"},
            {label:"Pañales",  value:(totals.panales/days).toFixed(1),   emoji:"🧷"},
          ].map(s=>(
            <div key={s.label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:`1px solid ${C.border}`}}>
              <span style={{fontSize:13,color:C.muted}}>{s.emoji} {s.label}</span>
              <span style={{fontSize:15,fontWeight:800,color:C.text}}>{s.value} / día</span>
            </div>
          ))}
        </div>

      </div>
    </div>
  );
}

const CLOUDINARY_CLOUD  = "dlisp6bbu";
const CLOUDINARY_PRESET = "lunita_audio";

// Upload audio blob to Cloudinary, save metadata to Firestore
const uploadGrabacion = async (blob, causa, duracion, roomCode) => {
  // 1. Upload to Cloudinary
  const formData = new FormData();
  formData.append("file", blob, `llanto_${Date.now()}.webm`);
  formData.append("upload_preset", CLOUDINARY_PRESET);
  formData.append("folder", "lunita_llantos");
  formData.append("resource_type", "video"); // Cloudinary uses "video" for audio files

  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/video/upload`,
    { method:"POST", body:formData }
  );
  if(!res.ok) throw new Error(`Cloudinary error: ${res.status}`);
  const data = await res.json();
  const url  = data.secure_url;
  const publicId = data.public_id;

  // 2. Save metadata to Firestore
  const docRef = await db.collection("lunita_llantos").add({
    roomCode: roomCode||"local",
    causa, duracion, url, publicId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });

  return { id:docRef.id, causa, duracion, url, createdAt: new Date().toISOString() };
};

const loadGrabaciones = async (roomCode) => {
  const snap = await db.collection("lunita_llantos")
    .where("roomCode","==", roomCode||"local")
    .orderBy("createdAt","desc")
    .limit(200)
    .get();
  return snap.docs.map(d=>({id:d.id,...d.data(), createdAt: d.data().createdAt?.toDate?.()?.toISOString()||new Date().toISOString()}));
};

const deleteGrabacion = async (id) => {
  await db.collection("lunita_llantos").doc(id).delete();
  // Note: Cloudinary asset stays (no server-side delete without signed API)
  // but the entry disappears from the app
};

function GrabacionRow({ g, causa, label, onDelete, onEdit }) {
  const [playing,   setPlaying]   = useState(false);
  const [confirm,   setConfirm]   = useState(false);
  const [deleting,  setDeleting]  = useState(false);
  const audioRef   = useRef(null);
  const longRef    = useRef(null);

  const toggle = () => {
    if(!audioRef.current) return;
    if(playing){ audioRef.current.pause(); audioRef.current.currentTime=0; setPlaying(false); }
    else { audioRef.current.play(); setPlaying(true); }
  };

  const startLong = () => {
    longRef.current = setTimeout(()=>{
      navigator.vibrate?.(40);
      setConfirm(true);
    }, 600);
  };
  const cancelLong = () => clearTimeout(longRef.current);

  const handleDelete = async () => {
    setDeleting(true);
    try { await deleteGrabacion(g.id); onDelete(g.id); }
    catch { setDeleting(false); setConfirm(false); }
  };

  if(confirm) return (
    <div style={{padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
      <div style={{fontSize:13,fontWeight:800,color:"#f87171",marginBottom:10}}>
        {causa.emoji} ¿Borrar esta grabación?
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={handleDelete} disabled={deleting} style={{flex:1,padding:"9px",borderRadius:10,border:"none",backgroundColor:"#f87171",color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
          {deleting?<span className="spin">⏳</span>:"🗑 Borrar"}
        </button>
        <button onClick={()=>setConfirm(false)} style={{flex:1,padding:"9px",borderRadius:10,border:`1px solid ${C.border}`,backgroundColor:C.elevated,color:C.muted,fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
          Cancelar
        </button>
      </div>
    </div>
  );

  return (
    <div
      onTouchStart={startLong}
      onTouchEnd={cancelLong}
      onTouchMove={cancelLong}
      onMouseDown={startLong}
      onMouseUp={cancelLong}
      onMouseLeave={cancelLong}
      style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:`1px solid ${C.border}`,userSelect:"none"}}
    >
      <span style={{fontSize:20,flexShrink:0}}>{causa.emoji}</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:800,color:causa.color}}>{causa.label}</div>
        <div style={{fontSize:11,color:C.muted}}>{label}</div>
      </div>
      <div style={{display:"flex",gap:6,flexShrink:0}}>
        <button onClick={()=>onEdit(g)} style={{
          border:`1px solid ${C.border}`, backgroundColor:C.elevated,
          borderRadius:20, width:32, height:32, cursor:"pointer",
          fontSize:13, display:"flex", alignItems:"center", justifyContent:"center",
        }}>✏️</button>
        {g.url && <>
          <audio ref={audioRef} src={g.url} onEnded={()=>setPlaying(false)} style={{display:"none"}}/>
          <button onClick={toggle} style={{
            border:`1px solid ${playing?causa.color:C.border}`,
            backgroundColor:playing?hexA(causa.color,0.15):C.elevated,
            borderRadius:20, width:32, height:32, cursor:"pointer",
            fontSize:13, display:"flex", alignItems:"center", justifyContent:"center",
          }}>{playing?"⏹":"▶"}</button>
        </>}
      </div>
    </div>
  );
}

function LlantoView({ roomCode, onSaveGrabacion, onDeleteGrabacion, onUpdateGrabacion, grabaciones, loading: loadingGrab }) {
  const [fase, setFase]    = useState("idle"); // idle|countdown|grabando|causa|subiendo|guardado|error
  const [editGrabacion, setEditGrabacion] = useState(null);
  const [segundos, setSeg] = useState(8);
  const [causa, setCausa]  = useState(null);
  const [blob, setBlob]    = useState(null);
  const [audioUrl, setUrl] = useState(null);
  const [errMsg, setErr]   = useState("");
  const timerRef   = useRef(null);
  const streamRef  = useRef(null);
  const chunksRef  = useRef([]);
  const recRef     = useRef(null);

  const cleanup = () => {
    clearInterval(timerRef.current);
    streamRef.current?.getTracks().forEach(t=>t.stop());
  };
  useEffect(() => () => cleanup(), []);

  const startGrab = async () => {
    setErr("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
      streamRef.current = stream;
      chunksRef.current = [];

      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus" : "audio/webm";
      const rec = new MediaRecorder(stream, {mimeType});
      recRef.current = rec;

      rec.ondataavailable = e => { if(e.data.size>0) chunksRef.current.push(e.data); };
      rec.onstop = () => {
        const b = new Blob(chunksRef.current, {type:"audio/webm"});
        setBlob(b);
        setUrl(URL.createObjectURL(b));
        streamRef.current?.getTracks().forEach(t=>t.stop());
        setFase("causa");
      };

      // 3s countdown then record
      setFase("countdown");
      let cd = 3; setSeg(cd);
      timerRef.current = setInterval(()=>{
        cd--;
        if(cd<=0){
          clearInterval(timerRef.current);
          rec.start(100);
          setFase("grabando");
          let secs=8; setSeg(secs);
          timerRef.current = setInterval(()=>{
            secs--; setSeg(secs);
            if(secs<=0){ clearInterval(timerRef.current); rec.stop(); }
          },1000);
        } else setSeg(cd);
      },1000);
    } catch(e) {
      setErr("No se pudo acceder al micrófono. Comprueba los permisos de la app.");
      setFase("idle");
    }
  };

  const cancelar = () => {
    recRef.current?.state==="recording" && recRef.current.stop();
    cleanup();
    setFase("idle"); setCausa(null); setBlob(null); setUrl(null);
  };

  const guardar = async () => {
    if(!causa||!blob) return;
    setFase("subiendo");
    try {
      const g = await uploadGrabacion(blob, causa, 8, roomCode);
      onSaveGrabacion(g);
      setCausa(null); setBlob(null); setUrl(null);
      setFase("guardado");
      setTimeout(()=>setFase("idle"), 2200);
    } catch(e) {
      console.error(e);
      setErr("Error al subir la grabación. Comprueba la conexión.");
      setFase("error");
    }
  };

  const total    = grabaciones.length;
  const objetivo = 150;
  const porCausa = CAUSAS.map(c=>({...c, n:grabaciones.filter(g=>g.causa===c.id).length}))
                         .filter(c=>c.n>0).sort((a,b)=>b.n-a.n);
  const pct = n => total>0 ? Math.round(n/total*100) : 0;

  return (
    <div style={{padding:16, paddingBottom:32}}>

      {/* IDLE */}
      {fase==="idle" && <>
        <div style={{textAlign:"center", marginBottom:24}}>
          <button onClick={startGrab} style={{
            width:150, height:150, borderRadius:75, border:"none", cursor:"pointer",
            backgroundColor:hexA("#f87171",0.12),
            boxShadow:`0 0 0 14px ${hexA("#f87171",0.07)}, 0 0 0 28px ${hexA("#f87171",0.03)}`,
            display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
            gap:8, margin:"0 auto", fontFamily:"inherit",
          }}>
            <span style={{fontSize:52}}>🎙️</span>
            <span style={{fontSize:13,fontWeight:900,color:"#f87171"}}>GRABAR</span>
          </button>
          <div style={{fontSize:12,color:C.muted,marginTop:20,lineHeight:1.8}}>
            Pulsa cuando el bebé esté llorando.<br/>
            Graba 8 segundos y luego te pregunta la causa.
          </div>
        </div>

        {/* Progress bar */}
        <div style={{backgroundColor:C.surface,borderRadius:14,padding:"14px 16px",border:`1px solid ${C.border}`,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:12,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Progreso</span>
            <span style={{fontSize:12,fontWeight:800,color:C.accent}}>{total} / {objetivo}</span>
          </div>
          <div style={{height:8,backgroundColor:C.elevated,borderRadius:4}}>
            <div style={{height:8,backgroundColor:C.accent,borderRadius:4,width:`${Math.min(100,total/objetivo*100)}%`,transition:"width 0.5s"}}/>
          </div>
          <div style={{fontSize:11,color:C.muted,marginTop:8,textAlign:"center"}}>
            {total===0 ? "Aún sin grabaciones — ¡empieza hoy!"
             : total<objetivo ? `${objetivo-total} grabaciones para poder entrenar la IA 🧠`
             : "🎉 ¡Objetivo alcanzado! Ya puedes entrenar la IA"}
          </div>
        </div>

        {/* Stats */}
        {loadingGrab && <div style={{textAlign:"center",color:C.muted,fontSize:13,padding:16}}>Cargando grabaciones…</div>}
        {!loadingGrab && total>0 && (
          <div style={{backgroundColor:C.surface,borderRadius:14,padding:"14px 16px",border:`1px solid ${C.border}`,marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:14}}>Causas más frecuentes</div>
            {porCausa.map(c=>(
              <div key={c.id} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:13,color:C.text}}>{c.emoji} {c.label}</span>
                  <span style={{fontSize:13,fontWeight:800,color:c.color}}>{c.n} · {pct(c.n)}%</span>
                </div>
                <div style={{height:6,backgroundColor:C.elevated,borderRadius:3}}>
                  <div style={{height:6,backgroundColor:c.color,borderRadius:3,width:`${pct(c.n)}%`,transition:"width 0.5s"}}/>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* HISTORIAL DE GRABACIONES */}
        {!loadingGrab && total>0 && (
          <div style={{backgroundColor:C.surface,borderRadius:14,padding:"14px 16px",border:`1px solid ${C.border}`}}>
            <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:14}}>Historial</div>
            {grabaciones.map((g,i)=>{
              const causa = CAUSAS.find(c=>c.id===g.causa)||CAUSAS[CAUSAS.length-1];
              const fecha = new Date(g.createdAt);
              const label = fecha.toLocaleDateString("es-ES",{day:"numeric",month:"short"})+" · "+fecha.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
              return (
                <GrabacionRow key={g.id||i} g={g} causa={causa} label={label} onDelete={onDeleteGrabacion} onEdit={setEditGrabacion}/>
              );
            })}
          </div>
        )}
      </>}

      {/* COUNTDOWN */}
      {fase==="countdown" && (
        <div style={{textAlign:"center",padding:"60px 0"}}>
          <div style={{fontSize:96,fontWeight:900,color:C.accent,lineHeight:1}}>{segundos}</div>
          <div style={{fontSize:15,color:C.muted,marginTop:16}}>Prepara el micrófono…</div>
          <button onClick={cancelar} style={{...ghostBtn,marginTop:28,width:"auto",display:"inline-flex"}}>Cancelar</button>
        </div>
      )}

      {/* GRABANDO */}
      {fase==="grabando" && (
        <div style={{textAlign:"center",padding:"40px 0"}}>
          <div style={{position:"relative",width:130,height:130,margin:"0 auto 20px"}}>
            <div style={{position:"absolute",inset:0,borderRadius:65,backgroundColor:hexA("#f87171",0.2),animation:"pulse 1s ease-in-out infinite"}}/>
            <div style={{position:"absolute",inset:8,borderRadius:57,backgroundColor:"#f87171",display:"flex",alignItems:"center",justifyContent:"center",fontSize:52}}>🎙️</div>
          </div>
          <div style={{fontSize:64,fontWeight:900,color:"#f87171",lineHeight:1}}>{segundos}</div>
          <div style={{fontSize:14,color:C.muted,marginTop:10}}>Grabando…</div>
          <button onClick={cancelar} style={{...ghostBtn,marginTop:24,width:"auto",display:"inline-flex"}}>Cancelar</button>
        </div>
      )}

      {/* CAUSA */}
      {fase==="causa" && (
        <div>
          <div style={{fontSize:17,fontWeight:900,marginBottom:4,color:C.text}}>¿Qué le pasaba?</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Atiéndele primero, luego vuelve y marca la causa.</div>
          {audioUrl && <audio controls src={audioUrl} style={{width:"100%",marginBottom:16,borderRadius:8}}/>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {CAUSAS.map(c=>(
              <button key={c.id} onClick={()=>setCausa(c.id)} style={{
                padding:"12px 10px",borderRadius:12,
                border:`2px solid ${causa===c.id?c.color:C.border}`,
                backgroundColor:causa===c.id?hexA(c.color,0.15):C.surface,
                cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:8,
              }}>
                <span style={{fontSize:22}}>{c.emoji}</span>
                <span style={{fontSize:13,fontWeight:800,color:causa===c.id?c.color:C.text}}>{c.label}</span>
              </button>
            ))}
          </div>
          {causa && <button style={primaryBtn} onClick={guardar}>☁️ Guardar y subir</button>}
          <button style={ghostBtn} onClick={cancelar}>Descartar</button>
        </div>
      )}

      {/* SUBIENDO */}
      {fase==="subiendo" && (
        <div style={{textAlign:"center",padding:"60px 0"}}>
          <span className="spin" style={{fontSize:48,display:"block",marginBottom:16}}>⏳</span>
          <div style={{fontSize:15,fontWeight:800,color:C.text}}>Subiendo grabación…</div>
          <div style={{fontSize:12,color:C.muted,marginTop:8}}>Guardando en la nube</div>
        </div>
      )}

      {/* GUARDADO */}
      {fase==="guardado" && (
        <div style={{textAlign:"center",padding:"60px 0"}}>
          <div style={{fontSize:64}}>✅</div>
          <div style={{fontSize:17,fontWeight:900,color:C.text,marginTop:16}}>¡Guardado en la nube!</div>
          <div style={{fontSize:13,color:C.muted,marginTop:8}}>Grabación sincronizada</div>
        </div>
      )}

      {/* ERROR */}
      {fase==="error" && (
        <div style={{textAlign:"center",padding:"40px 0"}}>
          <div style={{fontSize:52}}>⚠️</div>
          <div style={{fontSize:15,fontWeight:800,color:"#f87171",marginTop:16}}>Error</div>
          <div style={{fontSize:13,color:C.muted,marginTop:8,marginBottom:24}}>{errMsg}</div>
          <button style={primaryBtn} onClick={()=>setFase("idle")}>Volver</button>
        </div>
      )}

    {editGrabacion&&<EditGrabacionModal g={editGrabacion} onSave={(id,causa)=>{onUpdateGrabacion(id,causa);setEditGrabacion(null);}} onClose={()=>setEditGrabacion(null)}/>}
    </div>
  );
}

];

// Interpolate percentile line value at age (months)
const interpWHO = (table, ageMonths) => {
  if(ageMonths <= table[0][0]) return table[0].slice(1);
  if(ageMonths >= table[table.length-1][0]) return table[table.length-1].slice(1);
  for(let i=0;i<table.length-1;i++){
    if(ageMonths>=table[i][0]&&ageMonths<=table[i+1][0]){
      const t=(ageMonths-table[i][0])/(table[i+1][0]-table[i][0]);
      return table[i].slice(1).map((v,j)=>v+(table[i+1][j+1]-v)*t);
    }
  }
  return table[table.length-1].slice(1);
};

// Get percentile rank of a value at given age
const getPercentile = (table, ageMonths, value) => {
  const [p3,p15,p50,p85,p97] = interpWHO(table, ageMonths);
  if(value<=p3)  return "<P3";
  if(value<=p15) return "P3–P15";
  if(value<=p50) return "P15–P50";
  if(value<=p85) return "P50–P85";
  if(value<=p97) return "P85–P97";
  return ">P97";
};

// ─── CRECIMIENTO VIEW ──────────────────────────────────────────────────────────
function CrecimientoView({ babyInfo, setBabyInfo, medidas, onAddMedida, onDeleteMedida, roomCode }) {
  const [showForm, setShowForm] = useState(false);
  const [showSetup, setShowSetup] = useState(!babyInfo);
  const [chartType, setChartType] = useState("peso"); // peso | talla
  // Setup form
  const [birthDate, setBirth] = useState("");
  const [sexo, setSexo]       = useState("M");
  // Medida form
  const [fecha,  setFecha]  = useState(todayStr());
  const [peso,   setPeso]   = useState("");
  const [talla,  setTalla]  = useState("");
  const [cabeza, setCabeza] = useState("");
  const [saving, setSaving] = useState(false);

  const saveBabyInfo = async () => {
    if(!birthDate) return;
    const info = {birthDate, sexo};
    setBabyInfo(info);
    await db.collection("lunita_salas").doc(roomCode||"local").update({babyInfo: info}).catch(()=>{});
    setShowSetup(false);
  };

  const ageMonths = (fecha) => {
    if(!babyInfo?.birthDate) return 0;
    const birth = new Date(babyInfo.birthDate+"T12:00:00");
    const d     = new Date(fecha+"T12:00:00");
    return Math.max(0, (d-birth)/(1000*60*60*24*30.44));
  };

  const saveMedida = async () => {
    if(!peso&&!talla&&!cabeza) return;
    setSaving(true);
    const m = { fecha, peso:peso?parseFloat(peso):null, talla:talla?parseFloat(talla):null, cabeza:cabeza?parseFloat(cabeza):null, createdAt:new Date().toISOString() };
    try {
      const ref = await db.collection("lunita_medidas").add({...m, roomCode:roomCode||"local"});
      onAddMedida({...m, id:ref.id});
      setPeso(""); setTalla(""); setCabeza(""); setShowForm(false);
    } catch(e){ console.error(e); }
    setSaving(false);
  };

  const wTable = babyInfo?.sexo==="F" ? WHO_WEIGHT_GIRLS : WHO_WEIGHT_BOYS;
  const lTable = babyInfo?.sexo==="F" ? WHO_LENGTH_GIRLS : WHO_LENGTH_BOYS;

  // Chart data
  const sorted = [...medidas].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  // For talla: fill forward last known value when missing
  const chartData = (() => {
    if(chartType==="peso") return sorted.filter(m=>m.peso);
    let lastTalla = null;
    return sorted.map(m=>{
      if(m.talla) { lastTalla=m.talla; return m; }
      if(lastTalla) return {...m, talla:lastTalla, tallaEstimada:true};
      return null;
    }).filter(Boolean);
  })();

  // SVG chart
  const W=340,H=200,padL=36,padB=28,padT=14,padR=10;
  const cW=W-padL-padR, cH=H-padB-padT;

  // Age range 0-12 months or up to max age
  const maxAgeM = Math.max(12, ...chartData.map(m=>Math.ceil(ageMonths(m.fecha))+1));
  const ageRange = Math.min(36, maxAgeM);

  // Value range
  const whoData = Array.from({length:ageRange+1},(_,i)=>interpWHO(chartType==="peso"?wTable:lTable, i));
  const whoMin = Math.min(...whoData.map(d=>d[0]))*0.97;
  const whoMax = Math.max(...whoData.map(d=>d[4]))*1.02;

  const xScale = a => padL + (a/ageRange)*cW;
  const yScale = v => padT + cH - ((v-whoMin)/(whoMax-whoMin))*cH;

  const pctColors = ["#f87171","#fb923c","#facc15","#4ade80","#facc15","#fb923c","#f87171"];
  const pctLabels = ["P3","P15","P50","P85","P97"];

  const pctPath = (pctIdx) => {
    const pts = Array.from({length:ageRange+1},(_,i)=>{
      const vals = interpWHO(chartType==="peso"?wTable:lTable,i);
      return `${xScale(i)},${yScale(vals[pctIdx])}`;
    });
    return "M"+pts.join("L");
  };

  // Latest measurement for percentile display
  const latest = chartType==="talla" ? [...chartData].reverse().find(m=>!m.tallaEstimada) : chartData[chartData.length-1];
  const latestAge = latest ? ageMonths(latest.fecha) : null;
  const latestVal = latest ? (chartType==="peso"?latest.peso:latest.talla) : null;
  const latestPct = (latestVal&&latestAge!=null) ? getPercentile(chartType==="peso"?wTable:lTable, latestAge, latestVal) : null;

  // ── SETUP SCREEN ──
  if(showSetup) return (
    <div style={{padding:20}}>
      <div style={{fontSize:19,fontWeight:900,marginBottom:8,color:C.text}}>📏 Configurar bebé</div>
      <div style={{fontSize:13,color:C.muted,marginBottom:24,lineHeight:1.6}}>Necesito la fecha de nacimiento y el sexo para calcular los percentiles OMS correctamente.</div>
      <label style={UL}>Fecha de nacimiento</label>
      <input type="date" value={birthDate} max={todayStr()} onChange={e=>setBirth(e.target.value)}
        style={{...tInput,width:"100%",fontSize:16,marginBottom:16}}/>
      <label style={UL}>Sexo</label>
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        {[{id:"M",label:"👦 Niño"},{id:"F",label:"👧 Niña"}].map(s=>(
          <button key={s.id} onClick={()=>setSexo(s.id)} style={{
            flex:1,padding:"12px",borderRadius:12,border:`2px solid ${sexo===s.id?C.accent:C.border}`,
            backgroundColor:sexo===s.id?C.accentDim:C.elevated,color:sexo===s.id?C.accent:C.text,
            fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:"inherit"
          }}>{s.label}</button>
        ))}
      </div>
      <button style={primaryBtn} onClick={saveBabyInfo} disabled={!birthDate}>💾 Guardar</button>
    </div>
  );

  // ── MAIN VIEW ──
  return (
    <div style={{padding:16,paddingBottom:32}}>

      {/* Chart type selector */}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {[{id:"peso",label:"⚖️ Peso"},{ id:"talla",label:"📏 Talla"}].map(t=>(
          <button key={t.id} onClick={()=>setChartType(t.id)} style={{
            flex:1,padding:"9px",borderRadius:10,border:`1px solid ${chartType===t.id?C.accent:C.border}`,
            backgroundColor:chartType===t.id?C.accentDim:C.surface,
            color:chartType===t.id?C.accent:C.muted,fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"
          }}>{t.label}</button>
        ))}
      </div>

      {/* SVG Chart with WHO percentile bands */}
      <div style={{backgroundColor:C.surface,borderRadius:16,padding:"12px 4px 8px",marginBottom:14,border:`1px solid ${C.border}`}}>
        {chartData.length===0 ? (
          <div style={{textAlign:"center",padding:"30px 0",color:C.muted,fontSize:13}}>
            Añade mediciones para ver la gráfica
          </div>
        ) : (
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
            {/* Y grid */}
            {[0,0.25,0.5,0.75,1].map(f=>{
              const v = whoMin+(whoMax-whoMin)*f;
              const y = yScale(v);
              const label = chartType==="peso"?v.toFixed(1):Math.round(v);
              return <g key={f}>
                <line x1={padL} y1={y} x2={W-padR} y2={y} stroke={C.border} strokeWidth="1"/>
                <text x={padL-4} y={y+3} textAnchor="end" fontSize="8" fill={C.muted}>{label}</text>
              </g>;
            })}
            {/* X axis labels (months) */}
            {Array.from({length:Math.min(ageRange,12)+1},(_,i)=>i*Math.ceil(ageRange/6)).filter((v,i,a)=>a.indexOf(v)===i&&v<=ageRange).map(m=>(
              <text key={m} x={xScale(m)} y={H-4} textAnchor="middle" fontSize="8" fill={C.muted}>{m}m</text>
            ))}
            {/* WHO percentile lines */}
            {[0,1,2,3,4].map((pi,i)=>(
              <path key={pi} d={pctPath(pi)} fill="none"
                stroke={pi===2?"#62a8f5":"#62a8f5"} strokeWidth={pi===2?1.5:0.8}
                strokeDasharray={pi===2?"none":"4,3"} opacity={pi===2?0.6:0.3}/>
            ))}
            {/* P labels at right edge */}
            {[0,1,2,3,4].map((pi)=>{
              const vals = interpWHO(chartType==="peso"?wTable:lTable, ageRange);
              return <text key={pi} x={W-padR+2} y={yScale(vals[pi])+3} fontSize="7" fill="#62a8f5" opacity="0.6">{pctLabels[pi]}</text>;
            })}
            {/* Baby's measurements line */}
            {chartData.length>1 && (
              <path d={"M"+chartData.map(m=>`${xScale(ageMonths(m.fecha))},${yScale(chartType==="peso"?m.peso:m.talla)}`).join("L")}
                fill="none" stroke={C.accent} strokeWidth="2" strokeLinejoin="round"/>
            )}
            {/* Dots */}
            {chartData.map((m,i)=>{
              const val = chartType==="peso"?m.peso:m.talla;
              const isEst = !!m.tallaEstimada;
              return <circle key={i} cx={xScale(ageMonths(m.fecha))} cy={yScale(val)}
                r={isEst?3:4} fill={isEst?"none":C.accent} stroke={isEst?C.accent:C.bg}
                strokeWidth={isEst?1.5:1.5} strokeDasharray={isEst?"2,2":"none"} opacity={isEst?0.5:1}/>;
            })}
          </svg>
        )}
        {/* Legend */}
        <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:4,paddingBottom:4}}>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:16,height:2,backgroundColor:C.accent,borderRadius:1}}/><span style={{fontSize:10,color:C.muted}}>Ignaciu</span></div>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:16,height:1.5,backgroundColor:"#62a8f5",borderRadius:1,opacity:0.5}}/><span style={{fontSize:10,color:C.muted}}>Percentiles OMS</span></div>
        </div>
      </div>

      {/* Latest percentile */}
      {latestPct && latest && (
        <div style={{backgroundColor:C.surface,borderRadius:12,padding:"12px 16px",marginBottom:14,border:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:11,color:C.muted}}>{chartType==="peso"?"Último peso":"Última talla"}</div>
            <div style={{fontSize:18,fontWeight:900,color:C.text}}>{chartType==="peso"?`${latest.peso} kg`:`${latest.talla} cm`}</div>
            <div style={{fontSize:11,color:C.muted,marginTop:2}}>{new Date(latest.fecha+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})}</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:11,color:C.muted}}>Percentil</div>
            <div style={{fontSize:20,fontWeight:900,color:C.accent}}>{latestPct}</div>
            <div style={{fontSize:10,color:C.muted}}>OMS {babyInfo.sexo==="F"?"niña":"niño"}</div>
          </div>
        </div>
      )}

      {/* Add button */}
      <button onClick={()=>setShowForm(true)} style={primaryBtn}>+ Añadir medición</button>

      {/* Add form */}
      {showForm && (
        <div style={{backgroundColor:C.elevated,borderRadius:14,padding:16,marginBottom:16,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:15,fontWeight:900,marginBottom:14,color:C.text}}>Nueva medición</div>
          <DTPicker label="Fecha" date={fecha} time="" onDate={setFecha} onTime={()=>{}}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>

// ─── SONIDOS VIEW ──────────────────────────────────────────────────────────────
function SonidosView({ playing, volumes, onToggle, onVolume, audioEngine }) {
  const [loadState, setLoadState] = useState({}); // "loading" | "ready" | "error"
  const n = Object.keys(playing).length;

  // Preload all MP3 sounds when the tab opens
  useEffect(() => {
    const mp3Sounds = SOUNDS.filter(s => s.mp3);
    mp3Sounds.forEach(async s => {
      setLoadState(p => ({...p, [s.id]:"loading"}));
      await audioEngine.preload(s.id);
      const ok = audioEngine.buffers[s.id] !== null;
      setLoadState(p => ({...p, [s.id]: ok ? "ready" : "error"}));
    });
  }, []);

  return (
    <div style={{padding:16}}>
      {n>0&&<div style={{backgroundColor:hexA(C.accent,0.12),borderRadius:12,padding:"10px 14px",marginBottom:14,border:`1px solid ${hexA(C.accent,0.3)}`,display:"flex",alignItems:"center",gap:8}}>
        <span>🔊</span><span style={{fontSize:13,fontWeight:700,color:C.accent}}>{n} sonido{n>1?"s":""} activo{n>1?"s":""}</span>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        {SOUNDS.map(s=>{
          const on      = !!playing[s.id];
          const state   = s.mp3 ? (loadState[s.id] || "loading") : "ready";
          const loading = state === "loading";
          const errored = state === "error";
          return(
            <div key={s.id} onClick={()=>!loading&&onToggle(s.id)}
              style={{backgroundColor:on?hexA(C.accent,0.12):C.surface,border:`1px solid ${on?C.accent:C.border}`,borderRadius:16,padding:"14px 12px",cursor:loading?"default":"pointer",userSelect:"none",opacity:loading?0.6:1,transition:"opacity 0.2s"}}>
              <div style={{fontSize:30,textAlign:"center",marginBottom:6}}>{s.emoji}</div>
              <div style={{fontSize:12,fontWeight:800,textAlign:"center",marginBottom:10,color:on?C.accent:C.text}}>{s.label}</div>
              <div style={{textAlign:"center",fontSize:11,fontWeight:700,padding:"5px 10px",borderRadius:8,
                backgroundColor: loading?C.elevated : on?C.accent:C.elevated,
                color: loading?C.muted : on?"#080b14":C.muted}}>
                {loading ? <span className="spin" style={{display:"inline-block"}}>⏳</span>
                 : errored ? "⚠️ Error"
                 : on ? "▐▐ Parar" : "▶ Reproducir"}
              </div>
              {on&&<input type="range" min={0} max={100} value={Math.round(volumes[s.id]*100)}
                onChange={e=>{e.stopPropagation();onVolume(s.id,e.target.value/100);}}
                onClick={e=>e.stopPropagation()}
                style={{width:"100%",marginTop:10,cursor:"pointer"}}/>}
            </div>
          );
        })}
      </div>
      <div style={{marginTop:14,backgroundColor:C.surface,borderRadius:12,padding:"10px 14px",border:`1px solid ${C.border}`,textAlign:"center"}}>
        <div style={{fontSize:12,color:C.muted}}>Puedes combinar varios sonidos a la vez</div>
      </div>
    </div>
  );
}

// ─── SUENO VIEW ────────────────────────────────────────────────────────────────
function SuenoView({ entries, onDelete, onFinalize, onEdit, onAdd }) {
  const suenoEntries = entries.filter(e => e.type==="sueno");

  const todayS = suenoEntries.filter(e => getEntryDate(e)===todayKey);
  const totalHoy = todayS.filter(e=>e.status==="done"&&e.duration).reduce((a,e)=>a+e.duration,0);
  const enCurso  = suenoEntries.filter(e=>e.status==="en_curso").length;

  return (
    <div>
      {/* Stats */}
      <div style={{padding:"16px 16px 10px"}}>
        <div style={{display:"flex",gap:10,marginBottom:10}}>
          {[
            {label:"Dormido hoy", value:fmtDur(totalHoy)||"0h",    emoji:"😴"},
            {label:"Períodos",    value:todayS.filter(e=>e.status==="done").length, emoji:"🔢"},
            {label:"Más largo",   value:fmtDur(maxPeriod)||"—",    emoji:"⭐"},

            <div key={s.label} style={{flex:1,backgroundColor:C.surface,borderRadius:14,padding:"10px 8px",border:`1px solid ${C.border}`,textAlign:"center"}}>

          ))}

          <div style={{backgroundColor:hexA(C.orange,0.1),borderRadius:12,padding:"10px 14px",border:`1px solid ${hexA(C.orange,0.4)}`,display:"flex",alignItems:"center",gap:8}}>
            <span>⏱</span><span style={{fontSize:13,fontWeight:700,color:C.orange}}>{enCurso} sueño en curso — pulsa para añadir el fin</span>

          <div style={{fontSize:17,fontWeight:800,color:C.text}}>Sin registros de sueño</div>
          <div style={{fontSize:13,marginTop:8,lineHeight:1.6}}>Pulsa <strong style={{color:C.accent}}>+</strong> para añadir el primer sueño</div>

        <div style={{paddingBottom:4}}>
          {suenoEntries.map(e=>(

// ─── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [setup,setSetup]       = useState(null);
  const [ready,setReady]       = useState(false);
  const [entries,setEntries]   = useState([]);
  const [tab,setTab]           = useState("registro");
  const prevTabRef = useRef(null);
  const [modal,setModal]       = useState(false);
  const [suenoModal,setSuenoModal] = useState(false);
  const [finalEntry,setFinal]  = useState(null);
  const [editEntry, setEditEntry] = useState(null);
  const [showSala,setShowSala] = useState(false);
  const [showImport,setShowImport] = useState(false);
  const [showStats, setShowStats]   = useState(false);
  const [fontScale, setFontScale]   = useState(()=>{ try{return parseFloat(localStorage.getItem("lunita_font")||"1");}catch{return 1;} });

  useEffect(()=>{
    try{localStorage.setItem("lunita_font", String(fontScale));}catch{}
  },[fontScale]);
  const [grabaciones,    setGrabaciones]    = useState([]);
  const [medidas,        setMedidas]        = useState([]);
  const [babyInfo,       setBabyInfoState]  = useState(null);
  const [loadingGrab,    setLoadingGrab]    = useState(false);
  const [lightColor,setLC]     = useState(LIGHT_COLORS[0]);
  const [brightness,setBr]     = useState(0.65);
  const [lightActive,setLA]    = useState(false);
  const [playing,setPlaying]   = useState({});
  const [volumes,setVolumes]   = useState(SOUNDS.reduce((a,s)=>({...a,[s.id]:0.7}),{}));
  const audioRef  = useRef(null);
  const unsubRef  = useRef(null);

  useEffect(()=>{
    audioRef.current = new AudioEngine();
    const saved = loadSetup();
    if(saved){ setSetup(saved); initWith(saved); }
    else setReady(true);
    return ()=>{ audioRef.current?.destroy(); unsubRef.current?.(); };
  },[]);

  const initWith = useCallback(s => {
    if(s.mode==="local"){
      setEntries(loadLocal());
      // Load medidas for local
      db.collection("lunita_medidas").where("roomCode","==","local").orderBy("fecha","asc").get()
        .then(snap=>setMedidas(snap.docs.map(d=>({id:d.id,...d.data()})))).catch(e=>console.warn("medidas:",e));
      setReady(true);
    } else {
      unsubRef.current?.();
      const unsub = salaRef(s.roomCode).onSnapshot(snap=>{
        if(snap.exists){
          setEntries(snap.data().entries||[]);
          if(snap.data().babyInfo) setBabyInfoState(snap.data().babyInfo);
        }
        setReady(true);
      },()=>setReady(true));
      unsubRef.current = unsub;
      // Load medidas
      db.collection("lunita_medidas").where("roomCode","==",s.roomCode).orderBy("fecha","asc").get()
        .then(snap=>setMedidas(snap.docs.map(d=>({id:d.id,...d.data()})))).catch(e=>console.warn("medidas:",e));
    }
  },[]);

  const handleSetupDone = s => { setSetup(s); initWith(s); };

  const persist = useCallback(async ne => {
    setEntries(ne);
    if(setup?.mode==="local") saveLocal(ne);
    else if(setup?.mode==="sala") await pushEntries(setup.roomCode, ne);
  },[setup]);

  const addEntry    = e  => persist([{...e,id:Date.now(),createdAt:new Date().toISOString()},...entries]);
  const delEntry    = id => persist(entries.filter(e=>e.id!==id));
  const updateEntry = (id,upd) => persist(entries.map(e=>e.id===id?{...e,...upd}:e));
  const handleEditSave = (id,upd) => {
    updateEntry(id,upd);
    // Also update in Firestore if sala mode
    if(setup?.mode==="sala") salaRef(setup.roomCode).update({entries: entries.map(e=>e.id===id?{...e,...upd}:e)});
  };
  const handleImport= imported => { const ids=new Set(entries.map(e=>e.id)); persist([...imported.filter(e=>!ids.has(e.id)),...entries]); };

  // Load grabaciones when user opens llanto tab
  useEffect(()=>{
    if(tab==="grabaciones" && prevTabRef.current!=="grabaciones" && setup) {
      setLoadingGrab(true);
      loadGrabaciones(setup.roomCode).then(gs=>{
        setGrabaciones(gs);
        setLoadingGrab(false);
      }).catch(()=>setLoadingGrab(false));
    }
    prevTabRef.current = tab;
  },[tab, setup]);

  const toggleSound = id => {
    const eng=audioRef.current; if(!eng)return;
    if(playing[id]){eng.stop(id);setPlaying(p=>{const n={...p};delete n[id];return n;});}
    else{
      const snd=SOUNDS.find(s=>s.id===id);
      eng.play(id,volumes[id],snd?.mp3||false);
      setPlaying(p=>({...p,[id]:true}));
    }
  };
  const setVol=(id,v)=>{setVolumes(p=>({...p,[id]:v}));if(playing[id])audioRef.current?.setVol(id,v);};
  const addMedida    = m => setMedidas(p=>[...p,m].sort((a,b)=>a.fecha.localeCompare(b.fecha)));
  const deleteMedida = async id => {
    await db.collection("lunita_medidas").doc(id).delete().catch(()=>{});
    setMedidas(p=>p.filter(m=>m.id!==id));
  };
  const handleSetBabyInfo = info => { setBabyInfoState(info); };
  const saveGrabacion = g => {
    setGrabaciones(p => [g, ...p]);
  };
  const removeGrabacion = id => {
    setGrabaciones(p => p.filter(g => g.id !== id));
  };
  const updateGrabacion = (id, causa) => {
    setGrabaciones(p => p.map(g => g.id===id ? {...g, causa} : g));
  };

  const handleLeaveSala = () => {
    unsubRef.current?.(); localStorage.removeItem(LS_SETUP); saveLocal([]);
    setSetup(null); setEntries([]); setShowSala(false); setReady(false);
    setTimeout(()=>setReady(true),50);
  };

  if(!ready) return (
    <div style={{minHeight:"100vh",backgroundColor:C.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,fontFamily:"'Nunito',system-ui,sans-serif"}}>
      <span style={{fontSize:48}}>🌙</span><span className="spin" style={{fontSize:24}}>⏳</span>
    </div>
  );

  if(!setup) return <SetupScreen onDone={handleSetupDone}/>;

  const isSala = setup.mode==="sala";

  return (
    <div style={{minHeight:"100vh",backgroundColor:C.bg,color:C.text,fontFamily:"'Nunito',system-ui,sans-serif",display:"flex",flexDirection:"column",zoom:fontScale}}>
      <style>{`@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(0.8)}}`}</style>

      <div style={{padding:"calc(env(safe-area-inset-top,0px) + 14px) 16px 10px",borderBottom:`1px solid ${C.border}`,backgroundColor:C.bg,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:24}}>🌙</span>
          <div>
            <div style={{fontSize:20,fontWeight:900,letterSpacing:-0.5}}>Lunita</div>
            <div style={{fontSize:11,color:C.muted}}>{isSala?`Sala de ${babyDisplayName(setup)}`:"Modo local"}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={()=>setShowStats(true)} style={{border:`1px solid ${C.border}`,backgroundColor:C.surface,borderRadius:10,padding:"6px 12px",color:C.muted,fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
            📊
          </button>
          <div style={{display:"flex",alignItems:"center",border:`1px solid ${C.border}`,backgroundColor:C.surface,borderRadius:10,overflow:"hidden"}}>
            {[{label:"A",scale:0.85},{label:"A",scale:1},{label:"A",scale:1.18}].map((f,i)=>(
              <button key={i} onClick={()=>setFontScale(f.scale)} style={{
                border:"none", background:fontScale===f.scale?C.elevated:"transparent",
                color:fontScale===f.scale?C.accent:C.muted,
                padding:"6px 9px", cursor:"pointer", fontFamily:"inherit",
                fontSize:9+i*3, fontWeight:800, lineHeight:1,
              }}>{f.label}</button>
            ))}
          </div>
          {isSala&&(
            <button onClick={()=>setShowSala(true)} style={{border:`1px solid ${C.border}`,backgroundColor:C.surface,borderRadius:10,padding:"6px 12px",color:C.accent,fontSize:12,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
              👨‍👩‍👧 {setup.roomCode}
            </button>
          )}
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",paddingBottom:72}}>
        {tab==="registro"      &&<RegistroView entries={entries.filter(e=>e.type!=="sueno")} onDelete={delEntry} onFinalize={setFinal} onEdit={setEditEntry} onExport={()=>exportJSON(entries,babyDisplayName(setup))} onImport={()=>setShowImport(true)} onReorder={ne=>persist([...ne,...entries.filter(e=>e.type==="sueno")])}/>}
        {tab==="sueno"         &&<SuenoView entries={entries} onDelete={delEntry} onFinalize={setFinal} onEdit={setEditEntry}/>}
        {tab==="grabaciones"   &&<LlantoView roomCode={setup?.roomCode} onSaveGrabacion={saveGrabacion} onDeleteGrabacion={removeGrabacion} onUpdateGrabacion={updateGrabacion} grabaciones={grabaciones} loading={loadingGrab}/>}
        {tab==="herramientas"  &&<HerramientasView lightColor={lightColor} setLC={setLC} brightness={brightness} setBr={setBr} lightActive={lightActive} setLA={setLA} playing={playing} volumes={volumes} onToggle={toggleSound} onVolume={setVol} audioEngine={audioRef.current} babyInfo={babyInfo} setBabyInfo={handleSetBabyInfo} medidas={medidas} onAddMedida={addMedida} onDeleteMedida={deleteMedida} roomCode={setup?.roomCode}/>}
      </div>

      {(tab==="registro"||tab==="sueno")&&(
        <button onClick={()=>tab==="sueno"?setSuenoModal(true):setModal(true)} style={{position:"fixed",bottom:80,right:18,width:54,height:54,borderRadius:27,backgroundColor:C.accent,border:"none",cursor:"pointer",fontSize:28,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 4px 20px ${hexA(C.accent,0.45)}`,zIndex:50,color:"#080b14",fontWeight:900,fontFamily:"inherit"}}>＋</button>
      )}

      <div style={{position:"fixed",bottom:0,left:0,right:0,backgroundColor:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {[{id:"registro",label:"Registros",emoji:"📋"},{id:"sueno",label:"Sueño",emoji:"😴"},{id:"grabaciones",label:"Grabaciones",emoji:"🎙️"},{id:"herramientas",label:"Herramientas",emoji:"🛠️"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 0 12px",border:"none",background:"none",cursor:"pointer",fontFamily:"inherit"}}>
            <span style={{fontSize:22,filter:tab===t.id?"none":"grayscale(1) opacity(0.45)"}}>{t.emoji}</span>
            <span style={{fontSize:10,fontWeight:800,color:tab===t.id?C.accent:C.muted}}>{t.label}</span>
          </button>
        ))}
      </div>

      {modal      &&<AddEntryModal onSave={addEntry}  onClose={()=>setModal(false)}/>
      }{suenoModal &&<AddEntryModal onSave={addEntry} onClose={()=>setSuenoModal(false)} initialType="sueno"/>}
      {finalEntry &&<FinalizeModal entry={finalEntry} onUpdate={updateEntry} onClose={()=>setFinal(null)}/>}
      {showSala   &&<SalaInfoModal setup={setup} onClose={()=>setShowSala(false)} onLeave={handleLeaveSala}/>}
      {showImport &&<ImportModal onImport={handleImport} onClose={()=>setShowImport(false)}/>
      }{editEntry  &&<EditEntryModal entry={editEntry} onSave={handleEditSave} onClose={()=>setEditEntry(null)}/>
      }{showStats   &&<StatsModal entries={entries} onClose={()=>setShowStats(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
